name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The arm64 hosted pool failed to acquire a runner after 15 minutes.
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/wxview
      - name: Build macOS arm64
        if: runner.os == 'macOS'
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/wxview-darwin-arm64" ./cmd/wxview
      - name: Python helper synthetic tests
        if: runner.os == 'macOS'
        run: python3 -B -m unittest discover -s internal/key/lldbhelper
      - name: Package and smoke release binaries
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-'))
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/build_release.py --target windows/amd64
          else
            python3 scripts/build_release.py --target darwin/amd64 --target darwin/arm64
          fi
      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-'))
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/build-manifest-*.json
